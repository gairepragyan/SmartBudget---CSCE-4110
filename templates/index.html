
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget</title>
</head>

<body>

    <h1>SmartBudget</h1>

    <p>
        Budget Optimization Using 0/1 Knapsack
        and Dynamic Programming
    </p>

    <h2>Enter Budget Information</h2>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    {% if success %}
        <p style="color: green;">
            {{ success }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="budget">Total Budget:</label>

            <input
                type="number"
                id="budget"
                name="budget"
                min="1"
                value="{{ budget }}"
                required
            >
        </p>

        <h2>Expense Information</h2>

        {% for expense in expenses %}

            <h3>Expense {{ loop.index }}</h3>

            <p>
                <label>Expense Name:</label>
                <input
                    type="text"
                    name="expense_name"
                    value="{{ expense.name }}"
                >
            </p>

            <p>
                <label>Expense Cost:</label>
                <input
                    type="number"
                    name="expense_cost"
                    min="1"
                    value="{{ expense.cost }}"
                >
            </p>

            <p>
                <label>Priority Score:</label>
                <input
                    type="number"
                    name="expense_priority"
                    min="0"
                    value="{{ expense.priority }}"
                >
            </p>

        {% endfor %}

        <button type="submit">
            Validate Expenses
        </button>

    </form>

</body>
</html>
