<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget</title>
</head>

<body>
    <h1>SmartBudget</h1>

    <p>
        Budget Optimization Using 0/1 Knapsack
        and Dynamic Programming
    </p>

    <h2>Enter Budget Information</h2>

    <form>
        <label for="budget">Total Budget:</label>

        <input
            type="number"
            id="budget"
            name="budget"
            min="1"
            required
        >

        <button type="submit">
            Optimize Budget
        </button>
    </form>
</body>
</html>
