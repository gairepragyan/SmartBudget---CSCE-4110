<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget</title>
</head>

<body>

    <h1>SmartBudget</h1>

    <p>
        Budget Optimization Using 0/1 Knapsack
        and Dynamic Programming
    </p>

    <h2>Enter Budget Information</h2>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    {% if success %}
        <p style="color: green;">
            {{ success }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="budget">Total Budget:</label>

            <input
                type="number"
                id="budget"
                name="budget"
                min="1"
                value="{{ budget }}"
                required
            >
        </p>

        <h2>Expense Information</h2>

        <p>
            <label for="expense_name">Expense Name:</label>

            <input
                type="text"
                id="expense_name"
                name="expense_name"
                value="{{ expense_name }}"
                required
            >
        </p>

        <p>
            <label for="expense_cost">Expense Cost:</label>

            <input
                type="number"
                id="expense_cost"
                name="expense_cost"
                min="1"
                value="{{ expense_cost }}"
                required
            >
        </p>

        <p>
            <label for="expense_priority">Priority Score:</label>

            <input
                type="number"
                id="expense_priority"
                name="expense_priority"
                min="0"
                value="{{ expense_priority }}"
                required
            >
        </p>

        <button type="submit">
            Validate Input
        </button>

    </form>

</body>
</html>
